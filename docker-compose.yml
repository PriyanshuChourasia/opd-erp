services:
  postgres_db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-opd}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-opd_db}
    # Host port and container name are env-overridable (COMPOSE_PROJECT_NAME,
    # POSTGRES_HOST_PORT) so a second deployment of this same repo on the same
    # host can run side by side — set both differently in that deployment's .env.
    # Also matters on a single deployment: the default 5432 collides with any
    # locally-running (non-Docker) Postgres on the host — set POSTGRES_HOST_PORT
    # to something else (e.g. 5433) if `docker compose up` fails to bind it.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only-ish convenience mount so an operator can pg_restore a
      # backup without leaving the db container. Backups are WRITTEN by the
      # api container (docker-entrypoint.sh) via its own mount of the same
      # volume — see DB_BACKUP_RESTORE.md.
      - db_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nest_user} -d ${POSTGRES_DB:-opd_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-opd}-api
    container_name: ${COMPOSE_PROJECT_NAME:-opd}_api
    restart: unless-stopped
    # Same collision risk as postgres_db above: the default 4000 collides
    # with a locally-running (non-Docker) copy of this API — override
    # API_HOST_PORT if `docker compose up` fails to bind it.
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-nest_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres_db:5432/${POSTGRES_DB:-opd_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_in_production_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production_refresh}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    volumes:
      - uploads:/app/apps/api/uploads
      # Pre-deploy pg_dump snapshots taken by docker-entrypoint.sh before any
      # migrate/seed/reset. Keep this mount point in sync with BACKUP_DIR in
      # docker-entrypoint.sh.
      - db_backups:/app/apps/api/backups
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  # Durable, inspectable pg_dump snapshots taken before every api start
  # that pushes schema/data changes (see DB_BACKUP_RESTORE.md).
  db_backups:
